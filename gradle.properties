# Blowdryer 设置版本（Spotless 等），留空则禁用。
gtnh.settings.blowdryerTag = 0.2.2

# 模组显示名，用于 mcmod.info。
modName = Horizon TST Fix

# 模组标识，小写。
modId = horizontstfix

# 模组根包名。
modGroup = dev.dsmnh.horizon.tstfix

# 是否以 modGroup 作为 Maven 发布分组。
useModGroupForPublishing = false

# 有可用更新时自动改写 build.gradle 与 settings.gradle。
autoUpdateBuildScript = false

# 目标 Minecraft 版本。
minecraftVersion = 1.7.10

# 目标 Forge 版本。
forgeVersion = 10.13.4.1614

# MCP 通道与映射版本。
channel = stable
mappingsVersion = 12
remoteMappings = https\://raw.githubusercontent.com/MinecraftForge/FML/1.7.10/conf/

# 开发环境默认玩家名。
developmentEnvironmentUserName = Huaxidesu

# 允许使用较新的 Java 语法（经 Jabel 降级到 JVM 8）。
enableModernJavaSyntax = true

# 为反编译源码补全泛型信息。
enableGenericInjection = true

# 生成版本常量类。
generateGradleTokenClass = dev.dsmnh.horizon.tstfix.Tags

# 版本常量字段名。
gradleTokenVersion = VERSION

# 模组标识与名称常量字段名（已废弃，但生成常量类仍需要）。
gradleTokenModId = MODID
gradleTokenModName = MODNAME
gradleTokenGroupName = GROUPNAME

# 替换源码中的 GRADLETOKEN 占位符。
replaceGradleTokenInFile = true

# 对外提供的 API 包，留空表示不提供。
apiPackage =

# 访问转换配置文件，留空表示不使用。
accessTransformersFile =

# 是否使用 Mixin。
usesMixins = false
separateMixinSourceSet =
usesMixinDebug = false
mixinPlugin =
mixinsPackage =
coreModClass =
containsMixinsAndOrCoreModOnly = false
forceEnableMixins = false

# 是否把依赖打包进产物。
usesShadowedDependencies = false
minimizeShadowedDependencies = true
relocateShadowedDependencies = true

# 引入常用仓库（CurseMaven、Modrinth 等）。
includeWellKnownRepositories = true
excludeWellKnownRepositories =

# 发布相关，本模组不发布。
usesMavenPublishing = false
modrinthProjectId =
modrinthRelations =
curseForgeProjectId =
curseForgeRelations =

# Spotless 与 Checkstyle 开关。
disableSpotless = false
disableCheckstyle = true

org.gradle.configuration-cache = true
org.gradle.parallel = true
